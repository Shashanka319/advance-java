plugins {
    id 'java'
    id 'war'
}

group = 'com.registration'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_24
    targetCompatibility = JavaVersion.VERSION_24
}

repositories {
    mavenCentral()
}

dependencies {
    // Jakarta EE 10 (Servlet API provided by Tomcat 10.1+)
    providedCompile 'jakarta.platform:jakarta.jakartaee-web-api:10.0.0'

    // MySQL Database Driver
    implementation 'com.mysql:mysql-connector-j:8.3.0'

    // Lombok (Compatible with JDK 24 javac)
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    testCompileOnly 'org.projectlombok:lombok:1.18.38'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'

    // Log4j2 Logging
    implementation 'org.apache.logging.log4j:log4j-api:2.24.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.24.1'

    // JUnit 5 Testing
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    //Encrpt the data in backend
    // Other dependencies (servlet, mysql, log4j)...
    implementation 'org.mindrot:jbcrypt:0.4'
}

test {
    useJUnitPlatform()
}