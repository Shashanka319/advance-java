<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

<h2>User Registration</h2>

<form action="register" method="POST">
    Name: <input type="text" name="name" placeholder="Full Name" required>
    <br><br>

    Email: <input type="email" name="email" placeholder="Email Address" required>
    <br><br>

    Address: <textarea name="address" placeholder="Address" rows="4" cols="30"></textarea>
    <br><br>

    Password: <input type="password" name="password" placeholder="Password" required>
    <br><br>

    Gender:
    <select name="gender" required>
        <option value="" disabled selected>Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
    </select>
    <br><br>

    <button type="submit">Submit</button>
</form>

</body>
</html>
